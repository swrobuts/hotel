# Render.com Blueprint: beschreibt den Web Service, den Render aus diesem Repo baut.
# Anleitung: dashboard/README.md
services:
  - type: web
    name: hotel-dashboard
    runtime: docker            # Render baut dashboard/Dockerfile
    rootDir: dashboard         # das Dashboard liegt in einem Unterordner des Repos
    plan: free                 # schläft nach 15 Minuten ohne Zugriff ein, erster Aufruf dauert dann bis zu einer Minute
    healthCheckPath: /health   # Render fragt diesen Pfad, um zu prüfen, ob die App läuft
    autoDeploy: true           # jeder Push auf main löst einen neuen Deploy aus
