# Vor den vorhandenen Regeln in pg_hba.conf einfuegen (PostgreSQL >= 16).
# Nur studi_hotel wird eingeschraenkt. Die bestehenden Anmelderegeln fuer
# hotel sowie fuer alle anderen Benutzer bleiben massgeblich.
# HOTEL_STUDI_ISOLATION_BEGIN
local "/^(?!hotel$).*" studi_hotel reject
host "/^(?!hotel$).*" studi_hotel all reject
local replication studi_hotel reject
host replication studi_hotel all reject
# HOTEL_STUDI_ISOLATION_END
